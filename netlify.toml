# Netlify config at repo ROOT so the project auto-detects with default
# settings (no base directory needed in the Netlify UI).
[build]
  publish = "pacman"
  functions = "pacman/netlify/functions"

# route /api/jev to the Netlify function (served at /.netlify/functions/jev)
[[redirects]]
  from = "/api/jev"
  to = "/.netlify/functions/jev"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
