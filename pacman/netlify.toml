[build]
  publish = "."

# route /api/jev to the Netlify function (served at /.netlify/functions/jev)
[[redirects]]
  from = "/api/jev"
  to = "/.netlify/functions/jev"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
